name: WASH FLOW CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate GraphOS orchestration DAG
        run: python3 .codex/graphos.py --test
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
